<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DueSoon · First version</title><style>body{font:16px Arial,sans-serif;max-width:850px;margin:40px auto;padding:0 20px;color:#243c35;background:#f8f9f5}h1{margin-bottom:5px}p{color:#63746c}form{display:flex;flex-wrap:wrap;gap:12px;padding:22px;background:white;border:1px solid #dce2d8;border-radius:8px}label{font-size:13px;flex:1}input{display:block;margin-top:8px;padding:10px;max-width:100%;box-sizing:border-box;border:1px solid #abb8a7;border-radius:4px}button{padding:10px 15px;cursor:pointer;background:#285d48;color:white;border:0;border-radius:4px}form button{align-self:flex-end}article{background:white;padding:18px;margin:12px 0;border:1px solid #dce2d8;border-radius:7px;display:flex;gap:12px;align-items:center}article input{margin:0}article div{flex:1;overflow-wrap:anywhere}small{display:block;margin-top:8px;color:#63746c}a{color:#285d48}footer{margin-top:30px;font-size:12px}#warning{color:#a33}</style></head><body><h1>DueSoon</h1><p>A simple list for your assignments.</p><form id="form"><label>Assignment<input id="title" required maxlength="100"></label><label>Course<input id="course" required maxlength="60"></label><label>Due date<input id="date" type="date" required min="2000-01-01" max="2100-12-31"></label><button>Add</button></form><h2>Assignments</h2><div id="list"></div><p id="warning" role="alert"></p><footer>First version · <a href="../">Open redesigned version</a></footer><script>
'use strict';
const $=s=>document.querySelector(s);let tasks=[];try{tasks=JSON.parse(localStorage.getItem('duesoon-v1')||'[]');if(!Array.isArray(tasks))throw Error()}catch{tasks=[];$('#warning').textContent='Stored data could not be read.'}
function save(){try{localStorage.setItem('duesoon-v1',JSON.stringify(tasks))}catch{$('#warning').textContent='Changes could not be saved to this browser.'}}
function render(){const list=$('#list');list.replaceChildren();if(!tasks.length){list.textContent='No assignments yet.'}tasks.forEach(t=>{const a=document.createElement('article'),c=document.createElement('input'),d=document.createElement('div'),s=document.createElement('small'),b=document.createElement('button');c.type='checkbox';c.checked=t.done;c.setAttribute('aria-label','Complete '+t.title);c.onchange=()=>{t.done=c.checked;save();render()};d.textContent=t.title;d.style.textDecoration=t.done?'line-through':'none';s.textContent=t.course+' | '+t.due;d.append(s);b.textContent='Delete';b.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()};a.append(c,d,b);list.append(a)})}
$('#form').onsubmit=e=>{e.preventDefault();const title=$('#title').value.trim(),course=$('#course').value.trim();if(!title||!course)return;tasks.push({id:crypto.randomUUID(),title,course,due:$('#date').value,done:false});save();$('#form').reset();render()};render();

</script></body></html>
